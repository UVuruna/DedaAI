# English-phonetic positive generation for "Cao Deda" — same purpose and
# mechanics as hej_deda_en.yaml (see its header): ~904 libritts_r speakers
# pronouncing the phrase via respellings, merged into output_cao_deda before
# augmentation. Both spellings ride along: "ciao" (the real loanword, in the
# voice's dictionary) and "chow" (the bare phonetic fallback).

model_name: "cao_deda_en"

# lang-ok-begin: phonetic respellings ARE the TTS input text
target_phrase:
  # English-phonetic respellings of "Ćao Deda" -- what an English voice must
  # READ to come out sounding Serbian. "ciao" earns its place on the owner's
  # argument (2026-08-22): it is a real English loanword from Italian, in the
  # TTS dictionary, and an English speaker says it exactly /tʃaʊ/ -- the same
  # sound "chow" spells, but from a word the voice has actually seen.
  - "ciao dedda"
  - "chow dedda"
  - "ciao deh dah"
  - "chow deh dah"

custom_negative_phrases:
  - "chow down"
  - "ciao"
  - "chow"
  - "bye bye"
  - "see ya"
# lang-ok-end

n_samples: 6000
n_samples_val: 1000

tts_batch_size: 50
augmentation_batch_size: 16

piper_sample_generator_path: "./piper-sample-generator"

output_dir: "./output_cao_deda_en"

rir_paths:
  - "./data/mit_rirs"

background_paths:
  - "./data/audioset_16k"

background_paths_duplication_rate:
  - 1

false_positive_validation_data_path: "./data/validation_set_features.npy"

augmentation_rounds: 1

feature_data_files:
  "ACAV100M_sample": "./data/openwakeword_features_ACAV100M_2000_hrs_16bit.npy"

batch_n_per_class:
  "ACAV100M_sample": 1024
  "adversarial_negative": 50
  "positive": 50

model_type: "dnn"
layer_size: 32

steps: 50000
max_negative_weight: 1500
target_false_positives_per_hour: 0.2
