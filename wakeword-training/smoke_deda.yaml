# SMOKE TEST config — the whole pipeline at toy scale (minutes, not hours).
# Owner's rule 2026-08-19: after two lost overnight runs, nothing long starts
# until every stage (generate -> resample guard -> augment -> train -> onnx)
# has passed once end-to-end. Same shape as hej_deda.yaml, tiny numbers.

model_name: "smoke_deda"

# lang-ok-begin: Serbian TTS input text
target_phrase:
  - "Hej Deda"

custom_negative_phrases:
  - "hej dete"
  - "deda"
# lang-ok-end

n_samples: 100
n_samples_val: 40

tts_batch_size: 50

augmentation_batch_size: 16

piper_sample_generator_path: "./piper-sample-generator"

output_dir: "./output_smoke_deda"

rir_paths:
  - "./data/mit_rirs"

background_paths:
  - "./data/audioset_16k"

background_paths_duplication_rate:
  - 1

false_positive_validation_data_path: "./data/validation_set_features.npy"

augmentation_rounds: 1

feature_data_files:
  "ACAV100M_sample": "./data/openwakeword_features_ACAV100M_2000_hrs_16bit.npy"

batch_n_per_class:
  "ACAV100M_sample": 256
  "adversarial_negative": 20
  "positive": 20

model_type: "dnn"
layer_size: 32

steps: 300
max_negative_weight: 1500
target_false_positives_per_hour: 0.2
